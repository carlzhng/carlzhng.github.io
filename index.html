<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio: projects, experience, and about." />
    <title>Carlson Zheng</title>
    <link rel="icon" href="./assets/project%20photos/logo.png" type="image/png" />
    <link rel="alternate icon" href="./assets/project%20photos/logo.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css?v=42" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <canvas id="pcbCanvas"></canvas>

    <header class="site-header">
      <div class="container header-inner">
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="#home">Home</a>
          <a class="nav-link" href="#about">About</a>
          <a class="nav-link" href="#projects">Projects</a>
          <a class="nav-link" href="#contact">Contact</a>
          <button id="themeToggle" class="icon-button press-btn" type="button" aria-label="Toggle theme">
            <span aria-hidden="true" id="themeIcon">◐</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main">
      <section id="home" class="hero hero-fullscreen">
        <div class="hero-name-wrap" id="heroNameWrap">
          <p class="kicker" id="heroKicker">Hey! My name is, </p>
          <h1 class="hero-name" id="heroName">Carlson Zheng</h1>
          <div class="hero-actions">
            <a class="button primary press-btn" href="#projects">view projects</a>
            <a class="button press-btn" id="resumeButton" href="./resume.html" target="_blank" rel="noreferrer">resume</a>
          </div>
          <div class="hero-links" id="heroLinks" aria-label="Social links"></div>
        </div>
        <div class="scroll-hint" aria-hidden="true">
          <span class="scroll-hint-line"></span>
          <span class="scroll-hint-text">scroll</span>
        </div>
      </section>

      <section id="education" class="section section-reveal">
        <div class="container">
          <div class="section-head reveal-card">
            <h2>education</h2>
          </div>
          <section class="card edu-box reveal-card" aria-label="Education">
            <div class="edu-row">
              <div class="stack">
                <div>
                  <p class="label" style="margin:0 0 6px 0">Program</p>
                  <p class="muted" id="eduProgram" style="margin:0">—</p>
                </div>
                <div>
                  <p class="label" style="margin:0 0 6px 0">School</p>
                  <p class="muted" id="eduSchool" style="margin:0">—</p>
                </div>
                <div class="stack" style="gap:6px">
                  <p class="muted small" id="eduMeta" style="margin:0">—</p>
                </div>
              </div>
              <img class="edu-logo" src="./assets/logos/uofa.jpg" alt="" />
            </div>
          </section>
          <section class="edu-courses reveal-card" id="eduCourses" aria-label="Relevant courses" hidden>
            <button class="courses-toggle press-btn" type="button" id="coursesToggle" aria-expanded="false" aria-controls="coursesPanel">
              <span>Relevant Courses</span>
              <span class="courses-toggle-icon" aria-hidden="true">▾</span>
            </button>
            <div class="courses-panel" id="coursesPanel">
              <div class="courses-panel-inner">
                <div id="coursesList"></div>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section id="about" class="section section-reveal">
        <div class="container">
          <div class="section-head reveal-card">
            <h2>about</h2>
            <p class="muted" id="aboutSubtitle"></p>
          </div>
          <section class="mini-block reveal-card" aria-label="About me">
            <p class="mini-text" id="aboutMeText"></p>
          </section>
          <div class="about-icons" role="tablist" aria-label="About">
            <div id="iconSlotAwards" data-icon="awards"></div>
            <div id="iconSlotExp" data-icon="exp"></div>
            <div id="iconSlotListen" data-icon="listening"></div>
          </div>
          <div class="tab-panels">
            <div class="tab-panel" role="tabpanel" id="tabAwards" aria-labelledby="awardsIcon">
              <div class="stack" id="awardsList"></div>
            </div>
            <div class="tab-panel is-active" role="tabpanel" id="tabExp" aria-labelledby="expIcon">
              <div class="stack" id="expList"></div>
            </div>
            <div class="tab-panel" role="tabpanel" id="tabListening" aria-labelledby="listenIcon">
              <div class="stack" id="listeningList"></div>
            </div>
          </div>
        </div>
      </section>

      <section id="projects" class="section section-reveal">
        <div class="container">
          <div class="section-head reveal-card">
            <h2>projects</h2>
            <p class="muted">Bringing Creative mode to real life.</p>
          </div>
          <div class="grid projects-folder-grid" id="projectsGrid" aria-live="polite"></div>
        </div>
      </section>

      <section id="contact" class="section alt section-reveal">
        <div class="container">
          <div class="section-head reveal-card">
            <h2>contact</h2>
            <p class="muted">want to work together? just reach out!</p>
          </div>
          <div id="contactMount"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="muted small">
          © <span id="year"></span> <span id="footerName">Carlson Zheng</span>.
        </p>
        <a class="muted small link" href="#main">Back to top</a>
      </div>
    </footer>

    <dialog class="modal" id="certificateModal" aria-label="Certificate preview">
      <div class="modal-inner modal-inner--cert">
        <button class="modal-close press-btn" id="certModalClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
        <div class="stack">
          <h3 id="certModalTitle" style="margin:0">Certificate</h3>
          <div id="certModalMedia" class="cert-modal-media"></div>
        </div>
      </div>
    </dialog>

    <dialog class="modal" id="projectModal" aria-label="Project details">
      <div class="modal-inner">
        <button class="modal-close press-btn" id="modalClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
        <div class="stack">
          <h3 id="modalTitle" style="margin:0">Project</h3>
          <p id="modalDesc" class="muted" style="margin:0"></p>
          <div id="modalTags" class="chip-row"></div>
          <div id="modalHighlights" class="muted"></div>
          <div id="modalLinks" class="contact-links"></div>
        </div>
      </div>
    </dialog>

    <script src="./app.js?v=38" type="module"></script>
  </body>
</html>
